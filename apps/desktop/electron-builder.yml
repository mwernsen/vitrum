# Packaging for the Vitrum desktop app (electron-builder).
#
# The renderer, main and preload bundles in out/ are self-contained (main and
# preload import only electron + node builtins; the renderer bundles the
# workspace packages), so no node_modules ship in the package — all workspace
# deps are devDependencies by design. build/icon.png is a placeholder rendered
# from the design-system logo; replace it when brand assets are finalised.
appId: com.github.mwernsen.vitrum
productName: Vitrum
directories:
  buildResources: build
files:
  - out/**

# Owning `.vitrum` is what makes double-clicking a panel launch (or focus) Vitrum — the OS then
# delivers the path via `open-file` (macOS) or argv (Windows/Linux), which F-058 FR-1 routes
# straight into the editor, bypassing the launch screen.
fileAssociations:
  - ext: vitrum
    name: Vitrum panel
    description: Vitrum stained-glass panel
    role: Editor
    mimeType: application/x-vitrum

mac:
  category: public.app-category.graphics-design
  # Unsigned until an Apple Developer ID is provisioned; first launch needs
  # right-click → Open. Add notarization alongside signing when available.
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  # electron-builder derives the executable name from the package name
  # (@vitrum/desktop → "@vitrumdesktop"), which AppImage rejects.
  executableName: vitrum
  # deb's default artifactName is ${name}_${version}_${arch}.${ext}, and ${name} is
  # the scoped package name — the slash in "@vitrum/desktop" made fpm write to
  # dist/@vitrum/desktop_0.1.0_amd64.deb, a directory that does not exist, so the
  # deb target failed while AppImage (which does not use ${name}) succeeded.
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: Graphics
  maintainer: mwn@synadia.nl
  target:
    - AppImage
    - deb

# Publishes installers to a draft GitHub release for the pushed tag; review the
# draft and publish it by hand. GH_TOKEN comes from the workflow environment.
publish:
  provider: github
  owner: mwernsen
  repo: vitrum
