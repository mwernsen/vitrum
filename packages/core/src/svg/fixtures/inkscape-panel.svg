<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Representative Inkscape 1.x export: real mm document, matching viewBox, a layer group with a
     translate transform, fills to ignore and strokes to import. Border + diagonal → two pieces. -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="120mm"
   height="120mm"
   viewBox="0 0 120 120"
   version="1.1">
  <defs>
    <linearGradient id="unused-grad">
      <stop offset="0" stop-color="#fff"/>
    </linearGradient>
  </defs>
  <g inkscape:label="Layer 1" inkscape:groupmode="layer" transform="translate(10,10)">
    <rect x="0" y="0" width="100" height="100" fill="#eef" stroke="#000" stroke-width="1"/>
    <path d="M 0,0 L 100,100" fill="none" stroke="#000" stroke-width="1"/>
    <text x="40" y="50" font-size="6">A</text>
  </g>
</svg>
