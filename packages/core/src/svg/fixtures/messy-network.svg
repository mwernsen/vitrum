<?xml version="1.0" encoding="UTF-8"?>
<!-- A deliberately messy hand-authored file (no physical units → ambiguous scale). Four edges of a
     square miss their corners by ~1 unit, an interior diagonal wall stops just short of the edges,
     one edge is duplicated, and there is a stray zero-length segment. Raw, piece detection finds
     nothing; healed at a reasonable tolerance it resolves to the two visually apparent triangles. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="none" stroke="#000">
    <path d="M0,0 L100,0.4"/>
    <path d="M100.6,0 L100,100"/>
    <path d="M100,100.5 L-0.2,100"/>
    <path d="M0,100.6 L0.3,-0.2"/>
    <path d="M0,0 L100,0.4"/>
    <path d="M0.5,0.3 L99.6,99.7"/>
    <path d="M50,50 L50,50"/>
  </g>
</svg>
