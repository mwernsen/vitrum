# Builds installers for every platform and attaches them to a draft GitHub
# release when a version tag is pushed. Flow:
#
#   1. bump "version" in apps/desktop/package.json to match the tag
#   2. git tag v0.2.0 && git push origin v0.2.0
#   3. review the draft release on GitHub and publish it
#
# The landing page's download buttons point at releases/latest, so they start
# working the moment the first release is published.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish installers (draft release)
        run: pnpm --filter @vitrum/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
