# Deploys the landing page (apps/website) to GitHub Pages on every push to
# main that touches it. One-time repo setup: Settings → Pages → Source =
# "GitHub Actions". The site is served at https://mwernsen.github.io/vitrum/;
# when a custom domain is configured, drop the --base flag below.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'packages/ui/src/design/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter @vitrum/website build --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
